Como **administrador** quiero que al registrar a un residente se sigan unas validaciones:

- No deber\xEDa permitir solo un nombre sin m\xEDnimo un apellido en el campo "nombre completo", deber\xEDa alertarlo.
- No deber\xEDa registrar nombres inv\xE1lidos: 22, @, . , ??\xBF, a
- Deber\xEDa tener l\xEDmite m\xE1ximo de caracteres los campos: nombre, contrase\xF1a, correo, habitaci\xF3n y edificio.
- No deber\xEDa poder introducir aprox 1000 caracteres sin que el sistema lo notifique.
- Los campos habitaci\xF3n y edificio permiten simbolos sin ninguna validaci\xF3n.
- No deber\xEDa poder introducirse una fecha check-in pasada (El sistema indica que el residente se ha creado correctamente, pero luego no aparece en el listado).
- El sistema permite introducir nombres de habitaci\xF3n y edificio que no existen, cuando idealmente deber\xEDan seleccionarse de una lista de habitaciones existentes y disponibles. Se puede intentar crear dos residentes con exactamente los mismos datos. 
- El sistema muestra el mensaje \u201Ccreado correctamente\u201D, pero el residente realmente no se crea. El sistema muestra mensajes de \xE9xito aunque la acci\xF3n no se complete realmente (por ejemplo, al crear un residente duplicado o con fecha inv\xE1lida).
